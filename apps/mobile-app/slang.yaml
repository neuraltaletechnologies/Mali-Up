base_locale: en
fallback_strategy: base_locale
input_directory: lib/i18n
input_file_pattern: .i18n.json
output_directory: lib/i18n/gen
output_file_name: strings.g.dart
# Both locales must be available synchronously and offline (no on-demand
# download) so runtime language switching stays instant, matching
# LocalizationService's existing synchronous ValueNotifier-based switch.
lazy: false
