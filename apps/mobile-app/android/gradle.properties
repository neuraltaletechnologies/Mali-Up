org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
# CI runners are ephemeral (one build, then discarded) -- persistent VFS
# watching only adds overhead there and was the source of the "Already
# watching path: .../android" exception seen mid-build in CI.
org.gradle.vfs.watch=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Optimized resource shrinking (AGP 8.12+): couples resource analysis with R8's
# code analysis so resources reachable only from dead code are stripped too.
# Becomes the default in AGP 9.0 -- remove this line once we're on 9.x.
android.r8.optimizedResourceShrinking=true

# Barcode scanning: use the UNBUNDLED ML Kit model. mobile_scanner otherwise
# packs the ~2-3 MB barcode model (libbarhopper_v3.so + the mlkit_barcode_models
# .tflite files) into every install. With this flag it swaps to
# play-services-mlkit-barcode-scanning, and Google Play Services downloads the
# model on demand (the AndroidManifest.xml `com.google.mlkit.vision.DEPENDENCIES`
# meta-data prefetches it right after install). Devices without Play Services
# fall back to manual code entry -- see BarcodeScannerScreen's error handling.
dev.steenbakker.mobile_scanner.useUnbundled=true
