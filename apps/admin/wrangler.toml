# Mali Up — Cloudflare Workers deployment
# Domain: maliup.neuraltale.com

name = "mali-up"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
# This date predates automatic process.env population. Firebase Admin and
# Auth.js read their runtime bindings through process.env.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Rate-limit counters for /api/admin/* (lib/rate-limit.ts) and the NextAuth
# login route (lib/auth.ts). Namespace "mali-up-rate-limit" was created via
# `wrangler kv namespace create` against this same Cloudflare account. Without
# a bound namespace, lib/rate-limit.ts falls back to an in-memory per-isolate
# counter (fine for local `wrangler dev`, not durable in production across
# multiple Worker instances).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "233412d3ab2749dab3f50d8f495076a0"

[vars]
NEXT_PUBLIC_BASE_URL = "https://maliup.neuraltale.com"

# NOTE: there used to be a CF_WORKER flag here, added to force
# @google-cloud/firestore's `preferRest` setting. Removed — that setting
# can't fix Firestore on Workers at all (see lib/firestore-rest.ts for why);
# every Firestore call in this app goes through that plain-REST client now,
# which needs no Workers-detection flag.

# Works around a Next.js 16 / OpenNext-Cloudflare bug where getMiddlewareManifest()
# does a dynamic require() of middleware-manifest.json, which Workers can't run
# (https://github.com/opennextjs/opennextjs-cloudflare/issues/1232). Safe here since
# this app has no middleware/proxy — auth guards live in the dashboard layout instead.
NEXT_PRIVATE_MINIMAL_MODE = "1"

# Public Firebase client SDK config — safe to commit (project identifiers only).
# NOTE: NEXT_PUBLIC_* vars are embedded by Next.js at BUILD TIME, not at Worker
# runtime. These [vars] entries do NOT affect the build at all — they're here
# only so `wrangler dev` (local preview) has them. For real production builds
# (Cloudflare's Git-connected Build, or `pnpm cf:build` locally with .env.local),
# ALL NEXT_PUBLIC_* values — including these five plus the API key — must be
# set as Build-time "Variables and secrets" on the Cloudflare Build page
# (Workers & Pages → mali-up → Settings → Build). This section is a convenience
# copy for `wrangler dev` only.
NEXT_PUBLIC_FIREBASE_PROJECT_ID          = "neuraltale-mali-up"
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN         = "neuraltale-mali-up.firebaseapp.com"
NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET      = "neuraltale-mali-up.firebasestorage.app"
NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "596683133951"
NEXT_PUBLIC_FIREBASE_APP_ID              = "1:596683133951:web:1430c6e5bcb28bb5a6cdca"

# NextAuth: required on non-Vercel / Cloudflare Workers deployments.
AUTH_TRUST_HOST = "true"

# Deployment: Cloudflare's native Git Build integration (Workers & Pages →
# mali-up → Settings → Build) is the ONLY deployer, and its build report is the
# single source of truth for deploy readiness. It triggers on pushes to the
# `production` branch — see promote-to-production.yml for the main → production
# release checkpoint, and promote-selective.yml for promoting mobile/web
# independently when both changed on main.
#
# By default this build has NO path scoping, so it rebuilds/redeploys on
# every push to `production` even when a push only touched apps/mobile-app.
# Run .github/scripts/set-cloudflare-build-watch-paths.sh once (needs a
# Cloudflare API token — see that script) to scope it to apps/admin/**,
# matching what release-android.yml already does for mobile via its
# `paths:` filter.
#
# The Cloudflare dashboard has TWO separate "Variables and secrets" panels —
# values must go in the right one or they silently have no effect:
#
# 1) Settings → Variables and Secrets (Worker RUNTIME — read via `env` by
#    NextAuth / Firebase Admin SDK on each request; changing these does NOT
#    require a rebuild):
#      AUTH_SECRET           (Secret) — NextAuth signing secret (openssl rand -base64 32)
#      AUTH_URL               (Variable) — https://maliup.neuraltale.com  ← NOT localhost
#      FIREBASE_PROJECT_ID    (Variable) — neuraltale-mali-up
#      FIREBASE_CLIENT_EMAIL  (Variable) — firebase-adminsdk-fbsvc@neuraltale-mali-up.iam.gserviceaccount.com
#      FIREBASE_PRIVATE_KEY   (Secret) — full PEM, literal \n escapes, not real newlines
#      PLAY_REPORTS_BUCKET    (Variable, optional) — pubsite_prod_… id of the Play
#                             Console report bucket; enables the dashboard's
#                             installs/uninstalls section. See docs/play-console-reports.md
#      PLAY_PACKAGE_NAME      (Variable, optional) — com.neuraltale.maliup
#      PLAY_SA_CLIENT_EMAIL / PLAY_SA_PRIVATE_KEY (optional) — dedicated report SA;
#                             falls back to FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY
#
# 2) Settings → Build → Variables and secrets (BUILD-TIME — inlined into the
#    client JS bundle by `next build`; changing these requires a fresh build,
#    a dashboard-only edit does nothing until the next deploy runs):
#      NEXT_PUBLIC_BASE_URL
#      NEXT_PUBLIC_FIREBASE_API_KEY
#      NEXT_PUBLIC_FIREBASE_PROJECT_ID
#      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#      NEXT_PUBLIC_FIREBASE_APP_ID
#
# AUTH_TRUST_HOST, NEXT_PRIVATE_MINIMAL_MODE and the [vars] above are already
# committed here and applied automatically on every `wrangler deploy` — no
# need to duplicate them in either dashboard panel.
