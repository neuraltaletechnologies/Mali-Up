# Mali Up — Cloudflare Workers deployment
# Domain: maliup.neuraltale.com

name = "mali-up"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_BASE_URL = "https://maliup.neuraltale.com"

# Works around a Next.js 16 / OpenNext-Cloudflare bug where getMiddlewareManifest()
# does a dynamic require() of middleware-manifest.json, which Workers can't run
# (https://github.com/opennextjs/opennextjs-cloudflare/issues/1232). Safe here since
# this app has no middleware/proxy — auth guards live in the dashboard layout instead.
NEXT_PRIVATE_MINIMAL_MODE = "1"

# Public Firebase client SDK config — safe to commit (project identifiers only).
# NOTE: NEXT_PUBLIC_* vars are embedded by Next.js at BUILD TIME, not at Worker
# runtime. These [vars] entries do NOT affect the build — they're here only so
# `wrangler dev` (local preview) has them. For production builds you must have
# these in .env.local (or CI env vars) when running `pnpm cf:build`.
# The one exception: NEXT_PUBLIC_FIREBASE_API_KEY is intentionally omitted here
# because it is already in .env.local. Do not commit it.
NEXT_PUBLIC_FIREBASE_PROJECT_ID          = "neuraltale-mali-up"
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN         = "neuraltale-mali-up.firebaseapp.com"
NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET      = "neuraltale-mali-up.firebasestorage.app"
NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "596683133951"
NEXT_PUBLIC_FIREBASE_APP_ID              = "1:596683133951:web:1430c6e5bcb28bb5a6cdca"

# NextAuth: required on non-Vercel / Cloudflare Workers deployments.
AUTH_TRUST_HOST = "true"

# Secret env vars set in the Cloudflare dashboard under:
# Workers & Pages → maliup → Settings → Variables and Secrets
#
# Secrets required (never commit these):
#   AUTH_SECRET                — NextAuth signing secret (openssl rand -base64 32)
#   AUTH_URL                   — https://maliup.neuraltale.com   ← NOT localhost
#   FIREBASE_PROJECT_ID        — neuraltale-mali-up
#   FIREBASE_CLIENT_EMAIL      — firebase-adminsdk-fbsvc@neuraltale-mali-up.iam.gserviceaccount.com
#   FIREBASE_PRIVATE_KEY       — paste full PEM with literal \n, not real newlines
#
# NOTE: NEXT_PUBLIC_FIREBASE_API_KEY is a BUILD-TIME var (embedded by next build),
# not a Worker runtime secret. Keep it in .env.local only — Cloudflare Secrets
# cannot inject it into already-built JS bundles. Run `pnpm cf:build` locally
# (where .env.local exists) before deploying.
