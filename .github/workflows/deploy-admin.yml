name: Build check maliup.neuraltale.com

# CI sanity check only — does NOT deploy. Actual deploys to maliup.neuraltale.com
# are handled by Cloudflare's native Git Build integration (Workers & Pages →
# mali-up → Settings → Build), which triggers on pushes to the `production`
# branch. This workflow just catches build breaks on `main` before they get
# promoted, via the promote-to-production.yml PR.
on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm run cf:build
