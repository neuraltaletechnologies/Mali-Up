name: Promote selectively (mobile / web / both)

# Manual alternative to the automatic main -> production PR in
# promote-to-production.yml, for when main has BOTH mobile-app and admin
# (web) changes but you only want one of them to ship right now.
#
# Run it from the Actions tab ("Run workflow") and pick a target:
#   - mobile: opens/updates a PR into `production` containing only the
#             current apps/mobile-app/** content from main (plus
#             .github/workflows/release-android.yml, since that file has
#             to be on `production` itself for a mobile-only release to
#             use its current version -- see ALWAYS_PATHS below).
#   - web:    same, but for apps/admin/** only.
#   - both:   does not create a new PR -- it just points you at the
#             existing full main -> production PR (promote-to-production.yml
#             already opens/updates that on every push to main), since that
#             PR already carries everything.
#
# Merging the resulting PR is still the human checkpoint that actually
# ships anything -- same as the existing promotion flow. Downstream:
#   - release-android.yml only fires on a production push that touches
#     apps/mobile-app/** (or itself), so a web-only PR merge won't trigger
#     a Play Store release.
#   - The Cloudflare Workers build for apps/admin (mali-up) used to rebuild
#     on every push to `production` regardless of target. Run
#     .github/scripts/set-cloudflare-build-watch-paths.sh once (needs a
#     Cloudflare API token -- see that script) to scope it to
#     apps/admin/**, same as release-android.yml already does for mobile.
#     Until that script has been run, treat every merge into production as
#     "web redeploys regardless of target."
#
# Shared paths (.github/workflows/*, l10n/, docs/, root config, services/)
# don't cleanly belong to one target, so mobile/web targets exclude them by
# default. If main has pending changes under a shared path, this workflow
# FAILS rather than silently promoting mobile/web without them -- rerun
# with include_shared: true to pull them in alongside the target app, or
# use target: both to fall back to the full main -> production PR.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to promote to production'
        type: choice
        required: true
        options:
          - mobile
          - web
          - both
      include_shared:
        description: 'If shared paths (.github/workflows, l10n/, docs/, root config, services/) changed on main, include them too instead of failing (mobile/web targets only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Point to the full promotion PR (target: both)'
        if: inputs.target == 'both'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base production --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Use the existing full promotion PR: #$existing (main -> production)."
            echo "It already carries every unreleased change, mobile and web."
          else
            echo "No open main -> production PR right now -- main and production are in sync, nothing to promote."
          fi

      - name: 'Build selective branch (target: mobile or web)'
        if: inputs.target != 'both'
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_SHARED: ${{ inputs.include_shared }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          case "${{ inputs.target }}" in
            mobile) SRC_PATH="apps/mobile-app"; ALWAYS_PATHS=(".github/workflows/release-android.yml") ;;
            web)    SRC_PATH="apps/admin"; ALWAYS_PATHS=() ;;
          esac

          BRANCH="promote/selective-${{ inputs.target }}"

          git fetch origin production main

          # Bail out early, before touching any branch, if there's nothing
          # to promote for this target at all. Must check ALWAYS_PATHS too
          # -- a change to only release-android.yml (no apps/mobile-app
          # diff) still needs to go out for a mobile promotion.
          if git diff --quiet origin/production origin/main -- "$SRC_PATH" "${ALWAYS_PATHS[@]}"; then
            echo "No differences in $SRC_PATH (or its required paths) between main and production -- nothing to promote."
            exit 0
          fi

          # Detect changes on main outside the target's own app folder and
          # its always-included paths -- these are "shared" paths that
          # don't obviously belong to this target. Fail unless the run was
          # explicitly told to include them.
          exclude_args=(":(exclude)$SRC_PATH")
          for p in "${ALWAYS_PATHS[@]}"; do
            exclude_args+=(":(exclude)$p")
          done

          shared_changes=$(git diff --no-renames --name-status origin/production origin/main -- . "${exclude_args[@]}")

          if [ -n "$shared_changes" ] && [ "$INCLUDE_SHARED" != "true" ]; then
            echo "::error::main has changes outside apps/mobile-app or apps/admin that a '${{ inputs.target }}' promotion would leave behind:"
            echo "$shared_changes"
            echo ""
            echo "Rerun this workflow with include_shared: true to bring these along too, or use target: both to promote everything via the full main -> production PR."
            exit 1
          fi

          git checkout -B "$BRANCH" origin/production

          # Replace the whole subtree with main's version rather than just
          # overlaying it, so files deleted on main are removed here too
          # (a plain `git checkout main -- path` only adds/updates, it
          # never deletes).
          sync_path() {
            local path="$1"
            git rm -r --cached --ignore-unmatch -- "$path" > /dev/null
            rm -rf -- "$path"
            git checkout origin/main -- "$path"
            git add -A -- "$path"
          }

          sync_path "$SRC_PATH"
          for p in "${ALWAYS_PATHS[@]}"; do
            sync_path "$p"
          done

          included_shared=false
          if [ -n "$shared_changes" ] && [ "$INCLUDE_SHARED" = "true" ]; then
            included_shared=true
            # Apply each shared change individually -- deleted files need
            # `git rm`, everything else can be synced the same way as above.
            while IFS=$'\t' read -r status path; do
              [ -z "$path" ] && continue
              if [ "$status" = "D" ]; then
                git rm -f --ignore-unmatch -- "$path"
              else
                sync_path "$path"
              fi
            done <<< "$shared_changes"
          fi

          if git diff --quiet --cached; then
            echo "No net changes to commit -- nothing to promote."
            exit 0
          fi

          git commit -m "Selective promote (${{ inputs.target }}): sync $SRC_PATH from main"
          git push origin "$BRANCH" --force

          body="Auto-generated by promote-selective.yml. Contains the current \`$SRC_PATH\` content from \`main\`"
          if [ ${#ALWAYS_PATHS[@]} -gt 0 ]; then
            body="$body, plus ${ALWAYS_PATHS[*]}"
          fi
          if [ "$included_shared" = "true" ]; then
            body="$body, plus these shared paths (include_shared was set): $(echo "$shared_changes" | cut -f2 | paste -sd, -)"
          fi
          body="$body. Merging this triggers the matching deploy (Play Store Open Testing for mobile; Cloudflare Workers rebuild for web). Review the diff before merging."

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base production --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated existing selective PR #$existing."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base production \
              --head "$BRANCH" \
              --title "Promote ${{ inputs.target }} to production" \
              --body "$body"
          fi
