name: Deploy Services (Cloudflare Workers)

# One pipeline for every backend Worker under services/.
#
#   PR (any branch)   → typecheck + wrangler dry-run for changed services
#   push to `dev`     → deploy changed services with `--env staging`
#   push to `main`    → deploy changed services to production
#   workflow_dispatch → deploy one chosen service to a chosen environment
#
# Adding a service: give it package.json (with a `typecheck` script),
# wrangler.toml (top level = production, [env.staging] = staging) and a
# GET /health route, then add one entry to the `filters` block below.
#
# Required repo config:
#   secrets.CLOUDFLARE_API_TOKEN  — needs Account: Workers Scripts Edit,
#                                   Workers R2 Storage Edit; Zone (neuraltale.com):
#                                   Workers Routes Edit, DNS Edit (custom domains)
#   secrets.CLOUDFLARE_ACCOUNT_ID
# Runtime secrets are NOT set here — use `wrangler secret put [--env staging]`.
on:
  pull_request:
    paths:
      - 'services/**'
      - 'packages/**'
      - '.github/workflows/deploy-services.yml'
  push:
    branches: [dev, main]
    paths:
      - 'services/**'
      - 'packages/**'
      - '.github/workflows/deploy-services.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service folder under services/'
        required: true
        default: 'file-service'
      environment:
        description: 'staging or production'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # A change to packages/** (shared code) redeploys every service.
          filters: |
            file-service:
              - 'services/file-service/**'
              - 'packages/**'
              - '.github/workflows/deploy-services.yml'
      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          DISPATCHED: ${{ inputs.service }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "services=[\"$DISPATCHED\"]" >> "$GITHUB_OUTPUT"
          else
            echo "services=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: [changes, check]
    if: github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    concurrency:
      group: deploy-${{ matrix.service }}-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # dev → staging, main → production; a manual run uses the chosen input.
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci

      - name: Deploy
        run: |
          if [ "$TARGET" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi

      - name: Smoke test /health (roll back on failure)
        run: |
          NAME=$(grep -m1 '^name' wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$TARGET" = "production" ]; then
            URL=$(grep -m1 '^PUBLIC_BASE_URL' wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
            ENV_FLAG=""
          else
            URL=$(awk '/^\[env.staging.vars\]/{f=1} f && /^PUBLIC_BASE_URL/{print; exit}' wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
            ENV_FLAG="--env staging"
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/health" | grep -q '"ok":true'; then
              echo "✅ $NAME healthy at $URL"; exit 0
            fi
            sleep 10
          done
          echo "❌ $URL/health failed — rolling back $NAME"
          npx wrangler rollback $ENV_FLAG --message "CI smoke test failed for ${{ github.sha }}" -y || true
          exit 1
