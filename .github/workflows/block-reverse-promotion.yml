name: Block production -> main PRs

# production never merges back into main. It is a fast-forward of main (see
# promote-to-production.yml + ff-promote-on-approve.yml). A production -> main
# PR only ever re-introduces the merge-commit ping-pong that used to make
# GitHub keep suggesting it. This closes any such PR automatically with an
# explanation.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > body.md <<'EOF'
          Closing automatically. **`production` never merges back into `main`.**

          `production` is a fast-forward of `main` (`promote-to-production.yml` +
          `ff-promote-on-approve.yml`). Merging this direction creates the
          merge-commit ping-pong that used to make GitHub keep suggesting this PR.

          If `production` genuinely has something `main` lacks, fix it on `main`
          and let it promote forward. And you can ignore GitHub's
          "`production` had recent pushes -- Compare & pull request" banner.
          EOF
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
