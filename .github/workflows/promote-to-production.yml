name: Promote main to production

# Opens (or updates) a single PR from main into production on every push to
# main. This PR is the human checkpoint before anything ships.
#
# You do NOT click "Merge" on this PR. Approving it (an approving review)
# triggers ff-promote-on-approve.yml, which fast-forwards `production` to the
# exact commit you approved and closes the PR. Fast-forwarding keeps
# `production` a strict prefix of `main` -- no merge commits, so GitHub never
# again suggests a "production -> main" pull request.
#
# Downstream of the fast-forward:
#   - Cloudflare rebuilds the admin/web Worker (it watches the production
#     branch itself; scoped to apps/admin/** only if
#     .github/scripts/set-cloudflare-build-watch-paths.sh has been run).
#   - release-android.yml ships a Play Store Open Testing release, but only
#     when apps/mobile-app/** actually changed in the promotion.
#
# Nothing here publishes to the Play Store production track.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open or update promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$'Auto-generated. **Approve this PR to ship it** -- do not click Merge.\n\nApproving triggers `ff-promote-on-approve.yml`, which fast-forwards `production` to this commit and closes the PR. That deploys the admin/web site (Cloudflare) and, if `apps/mobile-app/**` changed, ships a Play Store **Open Testing** release (not the production track). Review the diff before approving.'
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base production --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Promotion PR #$existing already open; refreshed its body. New commits update it automatically."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base production \
              --head main \
              --title "Promote main to production" \
              --body "$body"
          fi
