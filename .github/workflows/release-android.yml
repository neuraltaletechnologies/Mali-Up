name: Release Android (Play Store)

# Auto-releases the mobile app to Google Play's production track.
# Deliberately scoped to the `production` branch only -- pushes to `main`
# never trigger a store release.
on:
  push:
    branches: [production]
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/release-android.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > android/keystore/mali-up-release.jks

      - name: Build release App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Publish to Play Store (staged rollout)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.neuraltale.maliup
          releaseFiles: apps/mobile-app/build/app/outputs/bundle/release/app-release.aab
          track: production
          userFraction: 0.2
          status: inProgress

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/keystore/mali-up-release.jks
