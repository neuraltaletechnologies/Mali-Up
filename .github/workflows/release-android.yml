name: Release Android (Open Testing)

# Auto-releases the mobile app to Google Play's Open Testing track (the
# Play Developer API still calls this track id "beta"; Play Console's UI
# label is "Open testing").
#
# `main` is the live branch. Merging a PR into `main` that touches
# apps/mobile-app/** ships an Open Testing release; the PR review is the
# checkpoint. A web-only merge never triggers this (paths filter). Direct
# work belongs on feature branches or `dev` -- see CLAUDE.md "Branching".
#
# To ship to the Play Store *production* track, promote a build from Open
# Testing to Production manually in Play Console once testers have verified
# it. There is no automated production-track release in this repo.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/release-android.yml'
  # Manual re-run from the Actions tab if a release needs to go out without
  # a fresh apps/mobile-app change (e.g. a failed upload to retry).
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # Explicit ceiling so a stuck/oversized build fails with a clear
    # "timeout" verdict instead of an ambiguous runner shutdown/cancellation
    # (exit 143) partway through -- see run 32095946540 (Aug 18 2026), where
    # bundleRelease had been running 977s with no such signal.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/mobile-app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile-app/android/**/*.gradle*', 'apps/mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > android/app/keystore/mali-up-release.jks

      # Assembles .env.json (gitignored, mirrors .env.example.json) from
      # per-key repo secrets. Built with jq off the `env` object rather than
      # interpolating `${{ secrets.* }}` into the shell string, so a value
      # containing quotes/backticks can't break the script or the JSON.
      - name: Write .env.json from secrets
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
          FIREBASE_MACOS_API_KEY: ${{ secrets.FIREBASE_MACOS_API_KEY }}
          FIREBASE_MACOS_APP_ID: ${{ secrets.FIREBASE_MACOS_APP_ID }}
          FIREBASE_WINDOWS_API_KEY: ${{ secrets.FIREBASE_WINDOWS_API_KEY }}
          FIREBASE_WINDOWS_APP_ID: ${{ secrets.FIREBASE_WINDOWS_APP_ID }}
          FIREBASE_WINDOWS_MEASUREMENT_ID: ${{ secrets.FIREBASE_WINDOWS_MEASUREMENT_ID }}
        # `// ""` on each field: a secret that hasn't been set in the repo
        # yet would otherwise come through as JSON null, which
        # --dart-define-from-file can't consume.
        run: |
          jq -n '{
            FIREBASE_PROJECT_ID: (env.FIREBASE_PROJECT_ID // ""),
            FIREBASE_MESSAGING_SENDER_ID: (env.FIREBASE_MESSAGING_SENDER_ID // ""),
            FIREBASE_STORAGE_BUCKET: (env.FIREBASE_STORAGE_BUCKET // ""),
            FIREBASE_ANDROID_API_KEY: (env.FIREBASE_ANDROID_API_KEY // ""),
            FIREBASE_ANDROID_APP_ID: (env.FIREBASE_ANDROID_APP_ID // ""),
            FIREBASE_IOS_API_KEY: (env.FIREBASE_IOS_API_KEY // ""),
            FIREBASE_IOS_APP_ID: (env.FIREBASE_IOS_APP_ID // ""),
            FIREBASE_IOS_BUNDLE_ID: (env.FIREBASE_IOS_BUNDLE_ID // ""),
            FIREBASE_WEB_API_KEY: (env.FIREBASE_WEB_API_KEY // ""),
            FIREBASE_WEB_APP_ID: (env.FIREBASE_WEB_APP_ID // ""),
            FIREBASE_AUTH_DOMAIN: (env.FIREBASE_AUTH_DOMAIN // ""),
            FIREBASE_WEB_MEASUREMENT_ID: (env.FIREBASE_WEB_MEASUREMENT_ID // ""),
            FIREBASE_MACOS_API_KEY: (env.FIREBASE_MACOS_API_KEY // ""),
            FIREBASE_MACOS_APP_ID: (env.FIREBASE_MACOS_APP_ID // ""),
            FIREBASE_WINDOWS_API_KEY: (env.FIREBASE_WINDOWS_API_KEY // ""),
            FIREBASE_WINDOWS_APP_ID: (env.FIREBASE_WINDOWS_APP_ID // ""),
            FIREBASE_WINDOWS_MEASUREMENT_ID: (env.FIREBASE_WINDOWS_MEASUREMENT_ID // "")
          }' > .env.json

      - name: Build release App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        # Version code = minutes since Unix epoch. Play Console requires every
        # upload's version code to exceed every version code it has ever seen
        # for this app; github.run_number (starts at 1 per-workflow) collided
        # with an already-published release. Epoch-minutes is monotonic
        # forever and needs no manual bookkeeping.
        #
        # --dart-define-from-file=.env.json mirrors the local
        # `flutter run --dart-define-from-file=.env.json` flow -- without it
        # every FIREBASE_* value in firebase_options.dart builds as an empty
        # string, which is what every Open Testing release has shipped with
        # until now.
        run: flutter build appbundle --release --build-number=$(( $(date +%s) / 60 )) --dart-define-from-file=.env.json

      - name: Publish to Play Store (Open Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.neuraltale.maliup
          releaseFiles: apps/mobile-app/build/app/outputs/bundle/release/app-release.aab
          track: beta
          status: completed

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/keystore/mali-up-release.jks
