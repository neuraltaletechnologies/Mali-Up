name: Release Android (Open Testing)

# Auto-releases the mobile app to Google Play's Open Testing track (the
# Play Developer API still calls this track id "beta"; Play Console's UI
# label is "Open testing").
#
# `main` is the live branch. Merging a PR into `main` that touches
# apps/mobile-app/** ships an Open Testing release; the PR review is the
# checkpoint. A web-only merge never triggers this (paths filter). Direct
# work belongs on feature branches or `dev` -- see CLAUDE.md "Branching".
#
# To ship to the Play Store *production* track, promote a build from Open
# Testing to Production manually in Play Console once testers have verified
# it. There is no automated production-track release in this repo.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/release-android.yml'
  # Manual re-run from the Actions tab if a release needs to go out without
  # a fresh apps/mobile-app change (e.g. a failed upload to retry).
  workflow_dispatch:

# One release at a time. Two overlapping runs race on the same Play version
# code and the same Gradle cache key; queue the newer one instead (never
# cancel — a cancelled run could abort a half-finished Play upload).
concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: write   # the version-bump step below pushes a commit to main

jobs:
  release:
    runs-on: ubuntu-latest
    # Explicit ceiling so a stuck/oversized build fails with a clear
    # "timeout" verdict instead of an ambiguous runner shutdown/cancellation
    # (exit 143) partway through -- see run 32095946540 (Aug 18 2026), where
    # bundleRelease had been running 977s with no such signal.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the default shallow clone -- the release-notes
          # step below walks arbitrarily far back to find the last release
          # marker commit.
          fetch-depth: 0

      # ubuntu-latest ships with only ~14 GB free on /. A release Flutter +
      # Gradle build plus the pub and Gradle caches overruns that, and the
      # runner then dies with "No space left on device" in its post-run steps
      # even though the Play upload itself already succeeded (runs
      # 33421604984 and 33423264413, Aug 31 2026 — every step green, job
      # still failed). Reclaim the big preinstalled toolchains this build
      # never touches. Each rm is best-effort so a layout change on the
      # runner image can't break the release.
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/mobile-app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile-app/android/**/*.gradle*', 'apps/mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      # Gate the release on the same checks a PR reviewer relies on. A red
      # `main` otherwise ships straight to Open Testing before anyone runs
      # these locally. Generated *.g.dart / *.freezed.dart are committed, so
      # no build_runner step is needed here.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode signing keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > android/app/keystore/mali-up-release.jks

      # Assembles .env.json (gitignored, mirrors .env.example.json) from
      # per-key repo secrets. Built with jq off the `env` object rather than
      # interpolating `${{ secrets.* }}` into the shell string, so a value
      # containing quotes/backticks can't break the script or the JSON.
      - name: Write .env.json from secrets
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
          FIREBASE_MACOS_API_KEY: ${{ secrets.FIREBASE_MACOS_API_KEY }}
          FIREBASE_MACOS_APP_ID: ${{ secrets.FIREBASE_MACOS_APP_ID }}
          FIREBASE_WINDOWS_API_KEY: ${{ secrets.FIREBASE_WINDOWS_API_KEY }}
          FIREBASE_WINDOWS_APP_ID: ${{ secrets.FIREBASE_WINDOWS_APP_ID }}
          FIREBASE_WINDOWS_MEASUREMENT_ID: ${{ secrets.FIREBASE_WINDOWS_MEASUREMENT_ID }}
          # Country-State-City API key — powers the worldwide region/district
          # picker on the business-details onboarding step. Optional: if unset
          # the app falls back to free-text region/district entry.
          CSC_API_KEY: ${{ secrets.CSC_API_KEY }}
        # `// ""` on each field: a secret that hasn't been set in the repo
        # yet would otherwise come through as JSON null, which
        # --dart-define-from-file can't consume.
        run: |
          jq -n '{
            FIREBASE_PROJECT_ID: (env.FIREBASE_PROJECT_ID // ""),
            FIREBASE_MESSAGING_SENDER_ID: (env.FIREBASE_MESSAGING_SENDER_ID // ""),
            FIREBASE_STORAGE_BUCKET: (env.FIREBASE_STORAGE_BUCKET // ""),
            FIREBASE_ANDROID_API_KEY: (env.FIREBASE_ANDROID_API_KEY // ""),
            FIREBASE_ANDROID_APP_ID: (env.FIREBASE_ANDROID_APP_ID // ""),
            FIREBASE_IOS_API_KEY: (env.FIREBASE_IOS_API_KEY // ""),
            FIREBASE_IOS_APP_ID: (env.FIREBASE_IOS_APP_ID // ""),
            FIREBASE_IOS_BUNDLE_ID: (env.FIREBASE_IOS_BUNDLE_ID // ""),
            FIREBASE_WEB_API_KEY: (env.FIREBASE_WEB_API_KEY // ""),
            FIREBASE_WEB_APP_ID: (env.FIREBASE_WEB_APP_ID // ""),
            FIREBASE_AUTH_DOMAIN: (env.FIREBASE_AUTH_DOMAIN // ""),
            FIREBASE_WEB_MEASUREMENT_ID: (env.FIREBASE_WEB_MEASUREMENT_ID // ""),
            FIREBASE_MACOS_API_KEY: (env.FIREBASE_MACOS_API_KEY // ""),
            FIREBASE_MACOS_APP_ID: (env.FIREBASE_MACOS_APP_ID // ""),
            FIREBASE_WINDOWS_API_KEY: (env.FIREBASE_WINDOWS_API_KEY // ""),
            FIREBASE_WINDOWS_APP_ID: (env.FIREBASE_WINDOWS_APP_ID // ""),
            FIREBASE_WINDOWS_MEASUREMENT_ID: (env.FIREBASE_WINDOWS_MEASUREMENT_ID // ""),
            CSC_API_KEY: (env.CSC_API_KEY // "")
          }' > .env.json

      - name: Build release App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        # Version code = minutes since Unix epoch. Play Console requires every
        # upload's version code to exceed every version code it has ever seen
        # for this app; github.run_number (starts at 1 per-workflow) collided
        # with an already-published release. Epoch-minutes is monotonic
        # forever and needs no manual bookkeeping.
        #
        # --dart-define-from-file=.env.json mirrors the local
        # `flutter run --dart-define-from-file=.env.json` flow -- without it
        # every FIREBASE_* value in firebase_options.dart builds as an empty
        # string, which is what every Open Testing release has shipped with
        # until now.
        #
        # --split-debug-info pulls the Dart debug symbols out of libapp.so and
        # --obfuscate renames Dart identifiers -- together they shrink the AOT
        # snapshot and make libapp.so unreadable without the symbol files. The
        # app ships no crash reporter, but the symbols are uploaded as a build
        # artifact below (keyed by commit SHA) so a Play Console ANR trace or a
        # future Crashlytics wiring can still be symbolicated.
        # Obfuscation-safe here: no dart:mirrors, enum persistence uses
        # `.name` (preserved) not `.toString()`, and Firestore access is
        # Map-based (no reflective toObject).
        run: flutter build appbundle --release --build-number=$(( $(date +%s) / 60 )) --dart-define-from-file=.env.json --obfuscate --split-debug-info=build/symbols

      - name: Archive Dart debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-${{ github.sha }}
          path: apps/mobile-app/build/symbols/
          # warn, not error: a missing symbols dir shouldn't block a release
          # that already built and uploaded to Play -- but with --obfuscate it
          # means that version's crash traces can't be decoded, so check the
          # log if this ever warns.
          if-no-files-found: warn
          retention-days: 90

      # Auto-generates the two files below from commit messages since the
      # last release, so nobody has to remember to hand-write them in the
      # PR anymore. See the script for exactly how (grouping rules, why the
      # Swahili file's body text stays in English, the 500-char Play cap).
      - name: Generate release notes from commits
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Publish to Play Store (Open Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.neuraltale.maliup
          releaseFiles: apps/mobile-app/build/app/outputs/bundle/release/app-release.aab
          # "beta" is the Play Developer API track id for the "Open testing"
          # channel. `tracks` (plural) replaces the deprecated `track` scalar.
          tracks: beta
          status: completed
          # Auto-generated by the step above from commit messages. Files
          # must be named `whatsnew-<BCP-47 locale>`; Play's listing-language
          # code for Swahili is the bare `sw` (no region), English needs a
          # region (`en-US`).
          whatsNewDirectory: apps/mobile-app/distribution/whatsnew

      # Every release should ship a higher version than the last -- keeps
      # pubspec.yaml as the always-current "what's live on Play Store"
      # record instead of relying on someone remembering to bump it by hand.
      # Patch-only: bump minor/major yourself in a PR when a release
      # deserves it and CI keeps patch-bumping from whatever you set.
      # continue-on-error so a push failure here (e.g. a branch-protection
      # rule on main) never masks that the Play Store upload above already
      # succeeded -- check this step's log if the version stops climbing.
      - name: Bump patch version for the next release
        continue-on-error: true
        run: |
          # Already in apps/mobile-app via the job's default working-directory.
          current=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:\s*//')
          name=${current%%+*}
          build=${current#*+}
          IFS='.' read -r major minor patch <<< "$name"
          next_name="$major.$minor.$((patch + 1))"
          if [ "$build" = "$current" ]; then
            next="$next_name"
          else
            next="$next_name+$((build + 1))"
          fi
          sed -i -E "s/^version:.*/version: $next/" pubspec.yaml
          echo "Bumped version: $current -> $next"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'Mali Up Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add apps/mobile-app/pubspec.yaml
          git commit -m "chore(release): bump mobile app to $next_name [skip ci]"
          # main may have moved (e.g. a web-only merge) since this run's
          # checkout; rebase the bump commit on top before pushing.
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            echo "Push rejected, retrying (attempt $attempt)..."
            git fetch origin main
            git rebase origin/main
          done

      # The bump above only ever lands on main. CLAUDE.md's branching docs
      # call syncing dev back up after a release a manual step ("git merge
      # main into dev"); in practice nobody was doing it just for this
      # commit, so dev's pubspec.yaml silently drifted further behind what
      # was actually live on every release (caught 2026-09-14 -- dev sat at
      # 1.1.2+3 while main had already climbed to 1.1.3+4). Since nothing
      # else ever lands on main without going through dev first (per those
      # same docs), a bot-authored version bump is the only thing that can
      # make main outrun dev here -- so mirroring just that one line onto
      # dev closes the gap for good, without the risk of an automated full
      # `git merge main` picking up something unrelated.
      #
      # Uses a separate worktree rather than `git checkout dev` so this
      # job's own `main` checkout (which later steps and the post-job cache
      # actions still expect) is never touched.
      - name: Sync version to dev
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          main_version=$(grep -E '^version:' apps/mobile-app/pubspec.yaml | sed -E 's/^version:\s*//')
          git fetch origin dev
          git worktree add /tmp/dev-version-sync origin/dev
          cd /tmp/dev-version-sync
          git config user.name 'Mali Up Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          dev_version=$(grep -E '^version:' apps/mobile-app/pubspec.yaml | sed -E 's/^version:\s*//')
          if [ "$dev_version" = "$main_version" ]; then
            echo "dev is already at $main_version, nothing to sync"
          else
            sed -i -E "s/^version:.*/version: $main_version/" apps/mobile-app/pubspec.yaml
            git add apps/mobile-app/pubspec.yaml
            git commit -m "chore(release): sync mobile app version to $main_version on dev [skip ci]"
            for attempt in 1 2 3; do
              git push origin HEAD:dev && break
              echo "Push rejected, retrying (attempt $attempt)..."
              git fetch origin dev
              git rebase origin/dev
            done
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/dev-version-sync --force

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/keystore/mali-up-release.jks
