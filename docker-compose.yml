version: '3.8'

services:
  # Primary High-Availability PostgreSQL for Business Data
  # Local dev only. Credentials below are intentionally simple defaults —
  # ports are bound to localhost so these aren't reachable from the network;
  # never reuse these values or the 0.0.0.0 binding in a shared/prod environment.
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MaliUp_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB for Logging and Customer Analytics
  mongodb:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db

  # Redis for High-Speed Session Caching and Locks
  redis:
    image: redis:alpine
    restart: always
    command: ['redis-server', '--requirepass', 'devlocalredis']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
