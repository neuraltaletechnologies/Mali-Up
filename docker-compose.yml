version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kaziya_postgres
    environment:
      POSTGRES_USER: kaziya_user
      POSTGRES_PASSWORD: kaziya_password
      POSTGRES_DB: kaziya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kaziya-net

  redis:
    image: redis:7-alpine
    container_name: kaziya_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kaziya-net

networks:
  kaziya-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
