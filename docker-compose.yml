version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: maliapp_postgres
    environment:
      POSTGRES_USER: maliapp_user
      POSTGRES_PASSWORD: maliapp_password
      POSTGRES_DB: maliapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maliapp-net

  redis:
    image: redis:7-alpine
    container_name: maliapp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - maliapp-net

networks:
  maliapp-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
